<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Media Tags Demo - W2-CL-02</title>
</head>
<body>

    <h1 style="text-align: center;">HTML5 Media </h1>
    <p style="text-align: center;"> W2-CL-02</p>

    <h2><strong><audio></strong> </h2>
    <p>Listen to a sample audio clip:</p>
    <audio controls>
        <source src="sample-3s.mp3" type="audio/mpeg">
    </audio>

    <h2><strong><video></strong> Tag - Video or Movie</h2>
    <p>Watch a sample video with subtitles:</p>
    <video width="400" height="300" controls>
        <source src="sample-5.mp4" type="video/mp4">
    </video>

    <br><br>

    <h2><strong><embed></strong> External Interactive Content</h2>
    <p>Embedded external content (PDF):</p>
    <embed src="sample-1.pdf" type="application/pdf" width="600" height="400">

    <br><br>

    <footer style="text-align: center; margin-top: 30px;">
        <p><strong>Exercise W2-CL-02</strong></p>
        <p>Demonstrated: <audio>, <video>, <source>, <embed>, <track></p>
    </footer>

</body>
</html>
