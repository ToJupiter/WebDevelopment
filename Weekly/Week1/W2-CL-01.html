<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Your Account</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif;">
        <img src="https://i0.wp.com/www.dafontfree.io/wp-content/uploads/2020/12/facebook-logo-official.png?resize=1100%2C750&ssl=1" alt="Your Logo" width="200" height="auto">

        <h1>Create A New Account</h1>
        <div> It's quick and easy.</div>

        <form action="#" method="post" style="display: inline-block; text-align: left; margin-top: 20px;">
            <label for="firstName">First Name:</label><br>
            <input type="text" id="firstName" name="firstName" required style="margin-bottom: 10px; padding: 8px; width: 300px;"><br>

            <label for="lastName">Surname:</label><br>
            <input type="text" id="lastName" name="lastName" required style="margin-bottom: 10px; padding: 8px; width: 300px;"><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required style="margin-bottom: 10px; padding: 8px; width: 300px;"><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required style="margin-bottom: 10px; padding: 8px; width: 300px;"><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" style="margin-bottom: 10px; padding: 8px; width: 300px;"><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Custom</label><br><br>

            <button type="submit" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; width: 300px;">
                Create My Account
            </button>
        </form>

        <p style="margin-top: 20px;">
            <a href="#">Already have an account?</a>
        </p>
    </div>

</body>
</html>
