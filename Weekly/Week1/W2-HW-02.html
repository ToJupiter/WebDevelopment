<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-8 sm:p-12 transition-all duration-300 ease-in-out">
        
        <header class="flex justify-between items-center mb-10">
            <div class="text-2xl font-bold text-gray-800">
                <!-- <span class="text-blue-500">S</span><span class="text-red-500">e</span><span class="text-yellow-500">a</span><span class="text-blue-500">r</span><span class="text-green-500">c</span><span class="text-red-500">h</span> -->
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-600 hover:text-gray-800 text-sm font-medium">About</button>
                <button class="text-gray-600 hover:text-gray-800 text-sm font-medium">Privacy</button>
                <button class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-full shadow-md transition-colors duration-200">Sign In</button>
            </div>
        </header>

        <main class="flex flex-col items-center">
            <!-- <h1 class="text-5xl sm:text-7xl font-bold text-gray-900 my-10 animate-fade-in">
                Search
            </h1> -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/1920px-Google_2015_logo.svg.png" width="300" height="200">
            <br>
            <div class="w-full flex items-center bg-gray-100 border border-gray-300 rounded-full py-3 px-6 shadow-sm focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition-all duration-300 ease-in-out">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 mr-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" placeholder="Search the web..." class="flex-grow bg-transparent text-gray-800 placeholder-gray-500 outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 ml-4 cursor-pointer hover:text-blue-500 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a7 7 0 01-7-7m7 7a7 7 0 017-7m-7 7V4m0 0h4m-4 0H8" />
                </svg>
            </div>
            
            <div class="flex space-x-4 mt-8">
                <button class="bg-gray-200 text-gray-700 hover:bg-gray-300 font-medium py-3 px-6 rounded-xl shadow-sm transition-colors duration-200">Search</button>
                <button class="bg-gray-200 text-gray-700 hover:bg-gray-300 font-medium py-3 px-6 rounded-xl shadow-sm transition-colors duration-200">Feeling Lucky</button>
            </div>
        </main>
        
        <!-- Footer Section -->
        <footer class="mt-16 text-center text-gray-500 text-sm">
            <p>Mockup Google Search.</p>
        </footer>

    </div>

</body>
</html>
